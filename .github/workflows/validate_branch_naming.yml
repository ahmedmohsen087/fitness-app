name: Validate Branch Name

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - development

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch name: $BRANCH_NAME"
          
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|chore|refactor|test|release|docs)/.+ ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Branch name must follow the pattern: <type>/<description>"
            echo "Allowed types: feature, bugfix, hotfix, chore, refactor, test, release, docs"
            echo "Example: feature/product-details"
            exit 1
          fi
          
          echo "✅ Branch name is valid: $BRANCH_NAME"